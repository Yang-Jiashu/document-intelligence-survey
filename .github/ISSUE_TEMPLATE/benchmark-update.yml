name: Benchmark update
description: Submit a new or corrected benchmark result for the survey tracker.
title: "[Benchmark Update]: "
labels:
  - benchmark-update
  - needs-triage
body:
  - type: input
    id: benchmark
    attributes:
      label: Benchmark
      description: Name the benchmark and split, e.g. MMLongBench-Doc, DocVQA, OCRBench v2 Text-rich VQA.
      placeholder: MMLongBench-Doc
    validations:
      required: true
  - type: input
    id: model
    attributes:
      label: Model or method
      placeholder: Qwen3-VL, RAG-Anything, AutoThinkRAG
    validations:
      required: true
  - type: input
    id: score
    attributes:
      label: Score and metric
      description: Include the exact metric and whether higher is better.
      placeholder: "60.2 Score / 0.602 normalized score"
    validations:
      required: true
  - type: input
    id: source
    attributes:
      label: Source URL
      description: Link to the paper, official leaderboard, repository, report, or reproducible evaluation artifact.
      placeholder: https://...
    validations:
      required: true
  - type: textarea
    id: setting
    attributes:
      label: Evaluation setting
      description: Describe prompts, context length, retrieval setup, open/API model, date observed, and any caveats.
      placeholder: "Observed on YYYY-MM-DD. End-to-end setting, no oracle retrieval, ..."
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence
      description: Paste table rows, screenshots, logs, paper excerpts, or reproduction notes.
    validations:
      required: false
