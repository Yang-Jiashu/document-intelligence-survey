name: Deploy to GitHub Pages

on:
  # 手动向 final 推送代码时部署
  push:
    branches: [final]

  # 自动更新工作流结束后检查并部署
  workflow_run:
    workflows:
      - "Update Dynamic Papers"
      - "Update SOTA snapshot"
      - "Update Research Progress"
    types:
      - completed

  # 允许在 Actions 页面手动部署
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  check-source-run:
    runs-on: ubuntu-latest
    outputs:
      allowed: ${{ steps.check.outputs.result }}
    steps:
      - name: Verify updater committed a safe snapshot
        id: check
        uses: actions/github-script@v7
        with:
          script: |
            if (context.eventName !== 'workflow_run') return true;
            const run = context.payload.workflow_run;
            const snapshotJobNames = {
              'Update SOTA snapshot': 'update-sota',
              'Update Research Progress': 'update-research'
            };
            const expectedJobName = snapshotJobNames[run.name];
            if (!expectedJobName) {
              return run.conclusion === 'success';
            }
            if (run.head_branch !== 'final' || run.status !== 'completed' ||
                !['success', 'failure'].includes(run.conclusion)) return false;
            const jobs = await github.paginate(github.rest.actions.listJobsForWorkflowRun, {
              ...context.repo,
              run_id: run.id,
              filter: 'latest',
              per_page: 100
            });
            const snapshotJobs = jobs.filter(job => job.name === expectedJobName);
            return snapshotJobs.length === 1 && snapshotJobs[0].conclusion === 'success';

  deploy:
    needs: check-source-run
    if: ${{ needs.check-source-run.outputs.allowed == 'true' }}

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest

    steps:
      - name: Checkout final branch
        uses: actions/checkout@v4
        with:
          ref: final

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "./docs"

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
