name: Deploy to GitHub Pages

on:
  # 手动向 final 推送代码时部署
  push:
    branches: [final]

  # 两个自动更新工作流结束后部署
  workflow_run:
    workflows:
      - "Update Dynamic Papers"
      - "Update SOTA snapshot"
    types:
      - completed

  # 允许在 Actions 页面手动部署
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    # 普通 push 和手动运行直接执行；
    # workflow_run 只有成功时才部署
    if: >
      github.event_name != 'workflow_run' ||
      github.event.workflow_run.conclusion == 'success'

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest

    steps:
      - name: Checkout final branch
        uses: actions/checkout@v4
        with:
          ref: final

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "./docs"

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
