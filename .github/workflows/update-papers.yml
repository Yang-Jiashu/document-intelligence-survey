name: Maintain Free Research Compatibility

on:
  schedule:
    - cron: "0 18 * * 0"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-papers:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      # Daily update-research.yml owns free arXiv/GitHub discovery. This job
      # preserves historical WeChat evidence and copies newer local metadata.
      - name: Maintain legacy data without paid APIs or network requests
        run: python scripts/update_dynamic_papers.py --free-only

      - name: Commit dynamic paper data
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Maintain free research compatibility data"
          file_pattern: docs/data/dynamic_papers.json docs/data/pending_dynamic_papers.json docs/data/update_log.json
