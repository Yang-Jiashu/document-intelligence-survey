<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>Paper Search - Document Intelligence Survey</title>
<link rel="stylesheet" href="css/style.css?v=20260712-1">
</head>
<body>

<header class="header">
<div class="header-inner">
<a href="index.html" class="logo"><div class="logo-icon">DI</div><span>DocIntel Survey</span></a>
<nav class="nav-links">
<a href="index.html#taxonomy">Taxonomy</a>
<a href="index.html#timeline">Timeline</a>
<a href="index.html#papers">Papers</a>
<a href="index.html#datasets">Datasets</a>
<a href="index.html#leaderboard">Models</a>
<a href="index.html#sota">SOTA</a>
<a href="index.html#feedback">Feedback</a>
<a href="https://github.com/Yang-Jiashu/document-intelligence-survey" target="_blank" class="github-btn">GitHub</a>
</nav>
</div>
</header>

<div class="search-section">
<div class="search-inner">
<div class="search-box">
<svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
<input type="text" placeholder="Search papers, methods, authors, tags..." id="searchInput">
</div>
<div class="filter-group" id="categoryFilters">
<button class="filter-btn active" data-filter="all">All</button>
<button class="filter-btn" data-filter="layout">Layout</button>
<button class="filter-btn" data-filter="ocr">OCR</button>
<button class="filter-btn" data-filter="table">Table</button>
<button class="filter-btn" data-filter="rag">RAG</button>
<button class="filter-btn" data-filter="vlm">VLM</button>
<button class="filter-btn" data-filter="eval">Eval</button>
</div>
</div>
</div>

<main class="main search-main">
<div class="section-title">
<h2>Paper Search</h2>
<span class="badge-count" id="resultSummary">Loading</span>
</div>
<div class="search-results-toolbar">
<div id="resultDetail" class="search-result-detail"></div>
<div class="search-sort-label">Sorted by year</div>
</div>
<div class="search-results-list" id="resultsContainer"></div>
<div class="pagination" id="pagination"></div>
</main>

<script src="js/search.js?v=20260902-1"></script>
</body>
</html>
